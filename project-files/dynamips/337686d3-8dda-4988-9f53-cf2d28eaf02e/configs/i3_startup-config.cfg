!
!
!
!
!
!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISP
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
!
crypto ipsec transform-set GRE-SET esp-aes esp-sha-hmac 
 mode transport
!
crypto ipsec profile DMVPN-PROF
 set transform-set GRE-SET 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 description to Casablanca-HQ
 ip address 10.254.0.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description to Site-Benguerir
 ip address 10.254.1.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet1/0
 description to Site-Benguerir
 ip address 10.254.2.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet2/0
 description to Site-Jorf
 ip address 10.254.3.1 255.255.255.0
 duplex auto
 speed auto
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
