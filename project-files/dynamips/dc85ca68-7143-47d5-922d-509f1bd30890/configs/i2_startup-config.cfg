!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Site-Jorf
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
!
crypto ipsec transform-set GRE-SET esp-aes esp-sha-hmac 
 mode transport
!
crypto ipsec profile DMVPN-PROF
 set transform-set GRE-SET 
!
!
crypto map GRE-MAP 10 ipsec-isakmp 
 set peer 10.254.0.10
 set transform-set GRE-SET 
 match address GRE-JORF
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Tunnel100
 ip address 172.20.0.4 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip nhrp map 172.20.0.1 10.254.0.10
 ip nhrp map multicast 10.254.0.10
 ip nhrp network-id 100
 ip nhrp nhs 172.20.0.1
 ip nhrp shortcut
 ip tcp adjust-mss 1360
 ip ospf network point-to-multipoint
 ip ospf 1 area 0
 tunnel source FastEthernet0/0
 tunnel mode gre multipoint
 tunnel key 100
 tunnel protection ipsec profile DMVPN-PROF
!
interface FastEthernet0/0
 description WAN to ISP
 ip address 10.254.3.10 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description LAN Jorf
 ip address 192.168.4.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router ospf 1
 log-adjacency-changes
 passive-interface default
 no passive-interface Tunnel100
 network 172.16.2.0 0.0.0.255 area 0
 network 172.20.0.0 0.0.0.255 area 0
 network 192.168.4.0 0.0.0.255 area 0
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 10.254.3.1
!
!
no ip http server
no ip http secure-server
!
ip access-list extended GRE-INTERESTING
 permit gre host 10.254.3.10 host 10.0.0.10
 permit gre host 10.254.0.10 host 10.254.3.10
 permit gre host 10.254.3.10 host 10.254.0.10
ip access-list extended GRE-JORF
 permit gre host 10.254.3.10 host 10.254.0.10
 permit gre host 10.254.0.10 host 10.254.3.10
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
